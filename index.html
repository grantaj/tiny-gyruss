<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Tiny Gyruss</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#05060a; touch-action:none; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const TAU = Math.PI * 2;
  const STATE = { TITLE: 0, PLAY: 1, GAMEOVER: 2 };
  let state = STATE.TITLE;

  let W = 0, H = 0, CX = 0, CY = 0, R = 0, DPR = 1;
  let last = performance.now();
  let elapsed = 0;

  const input = {
    held: false,
    holdStart: 0,
    charge: 0,
    pointerId: null,
  };

  const game = {
    score: 0,
    lives: 3,
    wave: 1,
    waveKills: 0,
    waveTarget: 14,
    spawnTimer: 0,
    spawnGap: 0.72,
    fireTimer: 0,
    flash: 0,
    invuln: 0,
    message: '',
    messageTimer: 0,
  };

  const player = {
    angle: -Math.PI / 2,
    dir: 1,
    speed: 1.72,
    velocity: 1.72,
    brake: 14.3,
    accel: 6.9,
    radius: 0,
  };

  const shots = [];
  const enemies = [];
  const enemyShots = [];
  const particles = [];
  const stars = [];

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    R = Math.min(W, H) * 0.405;
    player.radius = R;
    initStars();
  }

  function initStars() {
    stars.length = 0;
    const n = Math.max(80, Math.floor((W * H) / 8500));
    for (let i = 0; i < n; i++) {
      stars.push({
        a: Math.random() * TAU,
        r: Math.random(),
        v: 0.11 + Math.random() * 0.28,
        s: 0.5 + Math.random() * 1.3,
      });
    }
  }

  function resetGame() {
    game.score = 0;
    game.lives = 3;
    game.wave = 1;
    game.waveKills = 0;
    game.waveTarget = 14;
    game.spawnTimer = 0.25;
    game.spawnGap = 0.72;
    game.fireTimer = 0;
    game.flash = 0;
    game.invuln = 1.2;
    game.message = 'WAVE 1';
    game.messageTimer = 1.1;

    player.angle = -Math.PI / 2;
    player.dir = 1;
    player.speed = 1.72;
    player.velocity = player.speed;

    shots.length = 0;
    enemies.length = 0;
    enemyShots.length = 0;
    particles.length = 0;
  }

  function startGame() {
    resetGame();
    state = STATE.PLAY;
    input.charge = 0;
  }

  function reverse() {
    if (state !== STATE.PLAY) return;
    player.dir *= -1;
    burstPlayer(4, '#79f7ff');
  }

  function press(pointerId = null) {
    if (input.held) return;
    input.held = true;
    input.holdStart = performance.now();
    input.pointerId = pointerId;
    if (state === STATE.PLAY) reverse();
  }

  function release(pointerId = null) {
    if (pointerId !== null && input.pointerId !== null && pointerId !== input.pointerId) return;
    input.held = false;
    input.charge = 0;
    input.pointerId = null;
  }

  window.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    press(e.pointerId);
  }, { passive: false });

  window.addEventListener('pointerup', e => {
    e.preventDefault();
    release(e.pointerId);
  }, { passive: false });

  window.addEventListener('pointercancel', e => release(e.pointerId));

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      release();
    }
  });

  function normAngle(a) {
    a %= TAU;
    return a < 0 ? a + TAU : a;
  }

  function angleDelta(a, b) {
    let d = normAngle(a) - normAngle(b);
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  function polar(a, r) {
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r };
  }

  function spawnEnemy() {
    const a = Math.random() * TAU;
    const typeRoll = Math.random();
    const type = typeRoll < 0.72 ? 0 : (typeRoll < 0.94 ? 1 : 2);
    const drift = (Math.random() < 0.5 ? -1 : 1) * (0.55 + Math.random() * 0.65);
    enemies.push({
      a,
      r: R * (0.08 + Math.random() * 0.07),
      vr: R * (0.18 + Math.random() * 0.055 + game.wave * 0.006),
      va: drift,
      hp: type === 2 ? 2 : 1,
      type,
      t: Math.random() * 10,
      fire: 0.9 + Math.random() * 1.8,
      alive: true,
    });
  }

  function playerFire() {
    shots.push({ a: player.angle, r: R - 10, vr: -R * 1.22 });
  }

  function enemyFire(e) {
    const da = angleDelta(player.angle, e.a);
    const lead = Math.max(-0.12, Math.min(0.12, da * 0.16));
    enemyShots.push({
      a: e.a + lead,
      r: e.r,
      vr: R * 0.50,
      va: 0,
    });
  }

  function burstAt(a, r, count, color) {
    const p = polar(a, r);
    for (let i = 0; i < count; i++) {
      const q = Math.random() * TAU;
      const sp = 25 + Math.random() * 95;
      particles.push({
        x: p.x, y: p.y,
        vx: Math.cos(q) * sp,
        vy: Math.sin(q) * sp,
        life: 0.25 + Math.random() * 0.38,
        max: 0.63,
        color,
      });
    }
  }

  function burstPlayer(count, color) {
    const p = polar(player.angle, R);
    for (let i = 0; i < count; i++) {
      const tangent = player.angle + Math.PI / 2 + (Math.random() - 0.5) * 1.8;
      const sp = 20 + Math.random() * 55;
      particles.push({
        x: p.x, y: p.y,
        vx: Math.cos(tangent) * sp,
        vy: Math.sin(tangent) * sp,
        life: 0.12 + Math.random() * 0.20,
        max: 0.32,
        color,
      });
    }
  }

  function killEnemy(e) {
    e.alive = false;
    const values = [100, 180, 350];
    game.score += values[e.type];
    game.waveKills++;
    burstAt(e.a, e.r, 11 + e.type * 4, e.type === 2 ? '#ffea6b' : '#ff6be5');
  }

  function hitPlayer() {
    if (game.invuln > 0) return;
    game.lives--;
    game.flash = 0.18;
    game.invuln = 1.8;
    burstAt(player.angle, R, 28, '#79f7ff');
    enemyShots.length = 0;
    if (game.lives <= 0) {
      state = STATE.GAMEOVER;
      input.held = false;
      input.charge = 0;
    }
  }

  function nextWave() {
    game.wave++;
    game.waveKills = 0;
    game.waveTarget = 12 + game.wave * 3;
    game.spawnGap = Math.max(0.27, 0.72 - game.wave * 0.035);
    game.spawnTimer = 0.35;
    game.fireTimer = 0;
    game.message = 'WAVE ' + game.wave;
    game.messageTimer = 1.0;
    game.invuln = Math.max(game.invuln, 0.8);
    game.score += 500;

    shots.length = 0;
    enemies.length = 0;
    enemyShots.length = 0;
  }

  function updateStars(dt) {
    for (const s of stars) {
      s.r += s.v * dt;
      if (s.r > 1.06) {
        s.r = 0.01;
        s.a = Math.random() * TAU;
        s.v = 0.11 + Math.random() * 0.28;
      }
    }
  }

  function update(dt) {
    elapsed += dt;
    updateStars(dt);

    if (state !== STATE.PLAY) {
      if (input.held) {
        const hold = (performance.now() - input.holdStart) / 1000;
        input.charge = Math.min(1, hold / 0.72);
        if (input.charge >= 1) startGame();
      }
      updateParticles(dt);
      return;
    }

    game.flash = Math.max(0, game.flash - dt);
    game.invuln = Math.max(0, game.invuln - dt);
    game.messageTimer = Math.max(0, game.messageTimer - dt);

    const targetVelocity = player.dir * player.speed;
    const braking = player.velocity !== 0 && Math.sign(player.velocity) !== Math.sign(targetVelocity);
    const maxChange = (braking ? player.brake : player.accel) * dt;
    const velocityError = targetVelocity - player.velocity;
    if (Math.abs(velocityError) <= maxChange) player.velocity = targetVelocity;
    else player.velocity += Math.sign(velocityError) * maxChange;
    player.angle = normAngle(player.angle + player.velocity * dt);

    game.fireTimer -= dt;
    if (game.fireTimer <= 0) {
      playerFire();
      game.fireTimer += 0.135;
    }

    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0 && game.waveKills < game.waveTarget) {
      spawnEnemy();
      game.spawnTimer += game.spawnGap * (0.78 + Math.random() * 0.48);
    }

    for (const s of shots) s.r += s.vr * dt;
    for (let i = shots.length - 1; i >= 0; i--) {
      if (shots[i].r < R * 0.01) shots.splice(i, 1);
    }

    for (const e of enemies) {
      e.t += dt;
      e.a = normAngle(e.a + e.va * dt * (0.35 + 0.65 * (e.r / R)));
      e.r += e.vr * dt * (1 + 0.12 * Math.sin(e.t * 2.3));
      e.fire -= dt;
      if (e.fire <= 0 && e.r > R * 0.28 && e.r < R * 0.78) {
        enemyFire(e);
        e.fire = 1.2 + Math.random() * 1.9;
      }
      if (e.r > R * 1.05) e.alive = false;
    }

    for (const b of enemyShots) {
      b.r += b.vr * dt;
      b.a = normAngle(b.a + b.va * dt);
    }

    // Player shots vs enemies: radial beam has a tight angular hit window.
    for (const s of shots) {
      for (const e of enemies) {
        if (!e.alive) continue;
        const angularWindow = 0.030 + 0.020 * (1 - e.r / R);
        if (Math.abs(angleDelta(s.a, e.a)) < angularWindow && Math.abs(s.r - e.r) < 13) {
          s.r = -999;
          e.hp--;
          if (e.hp <= 0) killEnemy(e);
          else burstAt(e.a, e.r, 5, '#ffffff');
          break;
        }
      }
    }

    // Enemies reaching the rim can collide with the ship.
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.r > R - 22 && Math.abs(angleDelta(player.angle, e.a)) < 0.075) {
        e.alive = false;
        hitPlayer();
      }
    }

    // Enemy bullets vs player.
    for (let i = enemyShots.length - 1; i >= 0; i--) {
      const b = enemyShots[i];
      if (b.r > R + 20) {
        enemyShots.splice(i, 1);
        continue;
      }
      if (b.r > R - 18 && Math.abs(angleDelta(player.angle, b.a)) < 0.050) {
        enemyShots.splice(i, 1);
        hitPlayer();
        break;
      }
    }

    for (let i = shots.length - 1; i >= 0; i--) if (shots[i].r < 0) shots.splice(i, 1);
    for (let i = enemies.length - 1; i >= 0; i--) if (!enemies[i].alive) enemies.splice(i, 1);

    if (state === STATE.PLAY && game.waveKills >= game.waveTarget) nextWave();

    updateParticles(dt);
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawStars() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const rr = s.r * R * 1.18;
      const p = polar(s.a, rr);
      const alpha = Math.min(0.95, 0.15 + s.r * 0.9);
      ctx.fillStyle = `rgba(160,205,255,${alpha})`;
      const sz = s.s * (0.55 + s.r * 1.25);
      ctx.fillRect(p.x, p.y, sz, sz);
      if (s.r > 0.72) {
        const tail = polar(s.a, rr - 6 * s.r);
        ctx.strokeStyle = `rgba(120,170,255,${alpha * 0.35})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(tail.x, tail.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawTunnel() {
    ctx.save();
    ctx.strokeStyle = 'rgba(84,102,160,0.16)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 5; i++) {
      const rr = R * (i / 5);
      ctx.beginPath();
      ctx.arc(CX, CY, rr, 0, TAU);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(22,28,50,0.82)';
    ctx.beginPath();
    ctx.arc(CX, CY, Math.max(3, R * 0.022), 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    const p = polar(player.angle, R);
    const inward = player.angle + Math.PI;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(inward);
    if (game.invuln > 0 && Math.floor(game.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.25;

    ctx.strokeStyle = '#79f7ff';
    ctx.fillStyle = '#102b3b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(-7, -7);
    ctx.lineTo(-3, 0);
    ctx.lineTo(-7, 7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-1, -3);
    ctx.lineTo(6, 0);
    ctx.lineTo(-1, 3);
    ctx.stroke();

    ctx.restore();

    // Tiny radial gun line gives a clear sense of aim.
    const muzzle = polar(player.angle, R - 10);
    ctx.strokeStyle = 'rgba(121,247,255,0.20)';
    ctx.beginPath();
    ctx.moveTo(muzzle.x, muzzle.y);
    const inner = polar(player.angle, R - 24);
    ctx.lineTo(inner.x, inner.y);
    ctx.stroke();
  }

  function drawEnemy(e) {
    const p = polar(e.a, e.r);
    const scale = 0.55 + 0.65 * (e.r / R);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(e.a + Math.PI / 2);
    ctx.scale(scale, scale);
    ctx.lineWidth = 1.7;

    if (e.type === 0) {
      ctx.strokeStyle = '#ff6be5';
      ctx.beginPath();
      ctx.moveTo(0, -7); ctx.lineTo(7, 5); ctx.lineTo(0, 2); ctx.lineTo(-7, 5); ctx.closePath();
      ctx.stroke();
    } else if (e.type === 1) {
      ctx.strokeStyle = '#ff8b67';
      ctx.beginPath();
      ctx.rect(-5, -5, 10, 10);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#ffea6b';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * TAU / 6 - Math.PI / 2;
        const x = Math.cos(a) * 7, y = Math.sin(a) * 7;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#ffea6b'; ctx.fillRect(-1.5, -1.5, 3, 3);
    }
    ctx.restore();
  }

  function drawShots() {
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#b8ffff';
    for (const s of shots) {
      const p1 = polar(s.a, s.r);
      const p2 = polar(s.a, s.r + 10);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }

    ctx.strokeStyle = '#ffcf6b';
    for (const b of enemyShots) {
      const p = polar(b.a, b.r);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, TAU);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    ctx.fillStyle = '#d9e7ff';
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(String(game.score).padStart(7, '0'), 14, 12);

    ctx.textAlign = 'right';
    ctx.fillText('W' + game.wave + '   ' + '♥'.repeat(Math.max(0, game.lives)), W - 14, 12);

    if (game.messageTimer > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px ui-monospace, monospace';
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, game.messageTimer * 1.8)})`;
      ctx.fillText(game.message, CX, CY - R * 0.63);
    }
  }

  function drawTitle() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#79f7ff';
    ctx.font = `bold ${Math.max(24, Math.min(46, W * 0.09))}px ui-monospace, monospace`;
    ctx.fillText('TINY GYRUSS', CX, CY - 48);

    ctx.fillStyle = '#d9e7ff';
    ctx.font = 'bold 14px ui-monospace, monospace';
    const line = state === STATE.GAMEOVER ? 'GAME OVER  ' + String(game.score).padStart(7, '0') : 'TAP TO CHANGE DIRECTION';
    ctx.fillText(line, CX, CY + 18);

    const bw = Math.min(230, W * 0.58);
    const bh = 8;
    const by = CY + 90;
    ctx.strokeStyle = '#63708c';
    ctx.strokeRect(CX - bw / 2, by, bw, bh);
    ctx.fillStyle = input.charge >= 1 ? '#ffffff' : '#79f7ff';
    ctx.fillRect(CX - bw / 2 + 2, by + 2, (bw - 4) * input.charge, bh - 4);

    ctx.fillStyle = '#d9e7ff';
    ctx.font = 'bold 12px ui-monospace, monospace';
    ctx.fillText('HOLD TO START', CX, by + 27);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = game.flash > 0 ? '#201018' : '#05060a';
    ctx.fillRect(0, 0, W, H);

    drawStars();
    drawTunnel();

    ctx.strokeStyle = 'rgba(121,247,255,0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();

    if (state === STATE.PLAY) {
      drawShots();
      for (const e of enemies) drawEnemy(e);
      drawPlayer();
      drawParticles();
      drawHud();
    } else {
      // Keep a little ambient movement on title/game-over screens.
      drawParticles();
      drawTitle();
    }
  }

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(0.033, Math.max(0, dt));
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
